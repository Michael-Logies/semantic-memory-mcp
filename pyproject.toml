[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-memory-mcp"
version = "1.0.2"
description = "Single-file, self-hosted semantic memory MCP server for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Michael Logies" }]
dependencies = [
    "fastmcp==3.4.7",
    "onnxruntime==1.29.0",
    "sqlite-vec==0.1.9",
    "huggingface_hub==1.28.0",
    "tokenizers==0.23.1",
    "numpy==2.5.2",
]

[project.scripts]
semantic-memory-mcp = "memory_server:main"

[project.urls]
Homepage = "https://github.com/Michael-Logies/semantic-memory-mcp"

[tool.setuptools]
py-modules = ["memory_server"]
